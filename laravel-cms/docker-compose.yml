x-log-rotation: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-hovi-storage-limit: &hovi-storage-limit
  size: "10G"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hovi-cms-app
    restart: unless-stopped
    storage_opt: *hovi-storage-limit
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://hovi.com.vn}
      FORCE_HTTPS: ${FORCE_HTTPS:-true}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-hovi_cms}
      DB_USERNAME: ${DB_USERNAME:-hovi}
      DB_PASSWORD: ${DB_PASSWORD:-hovi_password}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDER: ${RUN_SEEDER:-false}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-120}
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: hovi-cms-nginx
    restart: unless-stopped
    storage_opt: *hovi-storage-limit
    depends_on:
      - app
    networks:
      - default
      - tikitech_network
    environment:
      DOMAIN: ${DOMAIN:-hovi.com.vn}
      CERT_NAME: ${CERT_NAME:-hovi.com.vn}
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/start.sh:/start.sh:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    command: ["/bin/sh", "/start.sh"]
    logging: *default-logging

  certbot:
    profiles: ["certbot"]
    image: certbot/certbot:latest
    container_name: hovi-cms-certbot
    restart: unless-stopped
    storage_opt: *hovi-storage-limit
    depends_on:
      - nginx
    environment:
      DOMAIN: ${DOMAIN:-hovi.com.vn}
      CERT_NAME: ${CERT_NAME:-hovi.com.vn}
      LE_EMAIL: ${LE_EMAIL:-admin@example.com}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
      - ./docker/certbot/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    logging: *default-logging

  mysql:
    image: mysql:8.0
    container_name: hovi-cms-mysql
    restart: unless-stopped
    storage_opt: *hovi-storage-limit
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hovi_cms}
      MYSQL_USER: ${DB_USERNAME:-hovi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hovi_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging

volumes:
  mysql_data:
  certbot_www:
  certbot_certs:

networks:
  tikitech_network:
    external: true
    name: tikitech_network
