services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-cms-app
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    command: php artisan serve --host=0.0.0.0 --port=8000
